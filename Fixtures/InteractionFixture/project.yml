name: InteractionFixture
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  XQXCUITestSupport:
    path: ../..
targets:
  InteractionFixture:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.experiencequality.interaction-fixture
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  InteractionFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InteractionFixture
      - package: XQXCUITestSupport
        product: XQXCUITestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: InteractionFixture
